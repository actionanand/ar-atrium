name: AR Atrium - GitHub Pages
on:
  push:
    branches: [main-github]
permissions:
  contents: write
concurrency:
  group: ar-atrium-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate source catalogue
        run: npm run catalog:validate
      - name: Synchronize canonical Policy Hub metadata
        run: npm run catalog:sync
      - name: Typecheck catalogue tooling
        run: npm run typecheck:tools
      - name: Lint
        run: npm run lint
      - name: Catalogue and configuration tests
        run: npm run test:catalog
      - name: Angular tests
        run: npm run test:ci
      - name: Check formatting
        run: npm run format:check
      - name: Inject production password hash
        env:
          PASSWORD_HASH: ${{ secrets.PASSWORD_HASH }}
        run: node scripts/inject-env.js
      - name: Build for GitHub Pages
        run: npm run build:gh
      - name: Generate SPA fallback
        run: npm run copy-error-page
      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: dist/ar-atrium/browser
          enable_jekyll: false

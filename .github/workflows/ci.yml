name: AR Atrium - Validation
on:
  pull_request:
  push:
    branches: [feature/1-basic-app]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - run: npm run catalog:validate
      - run: npm run catalog:sync
      - run: npm run typecheck:tools
      - run: npm run lint
      - run: npm run test:catalog
      - run: npm run test:ci
      - run: npm run format:check
      - name: Configure non-deploying build test
        env:
          PASSWORD_HASH: '0000000000000000000000000000000000000000'
        run: node scripts/inject-env.js
      - run: npm run build:gh
      - run: npm run copy-error-page
